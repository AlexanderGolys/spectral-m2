[package]
name = "spectral-m2"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "spectral-m2"
path = "src/main.rs"

[dependencies]
crossterm = { version = "0.29.0", features = ["osc52"] }
ratatui = "0.30.0"
rand = "0.8.6"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tree-sitter = "0.26.8"
tree-sitter-highlight = "0.26.8"
tree-sitter-language = "0.1.7"
tree-sitter-macaulay2 = "2.4.0"
