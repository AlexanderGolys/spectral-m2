[package]
name = "spectral-m2"
version = "0.4.0"
edition = "2021"
description = "A syntax-aware terminal shell for Macaulay2"
license = "GPL-3.0-only"
repository = "https://github.com/AlexanderGolys/spectral-m2"
readme = "README.md"
keywords = ["macaulay2", "repl", "terminal", "syntax-highlighting", "tui"]
categories = ["command-line-utilities", "development-tools"]
include = [
    "src/**/*.rs",
    "src/**/*.m2",
    "src/**/*.toml",
    "Cargo.lock",
    "CHANGELOG.md",
    "LICENSE",
    "README.md",
]

[[bin]]
name = "spectral-m2"
path = "src/main.rs"

[dependencies]
crossterm = { version = "0.29.0", features = ["osc52"] }
m2-syn = { version = "0.3.0", default-features = false, features = ["pretty", "walk"] }
jsonrpc = { version = "0.20.1", default-features = false, features = ["simple_tcp"] }
regex = "1.11"
ratatui = { version = "0.30.0", features = ["serde"] }
rand = "0.8.6"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
toml = "1.1.4"
these-macros-should-be-illegal = "0.7.0"

[lints.rust]
missing_docs = "deny"
