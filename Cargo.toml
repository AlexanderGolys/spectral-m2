[package]
name = "spectral-m2"
version = "1.0.0"
edition = "2021"
description = "A syntax-aware terminal shell for Macaulay2"
license = "MIT OR Apache-2.0"
repository = "https://github.com/AlexanderGolys/spectral-m2"
readme = "README.md"
keywords = ["macaulay2", "repl", "terminal", "syntax-highlighting", "tui"]
categories = ["command-line-utilities", "development-tools"]
include = [
    "build.rs",
    "src/**/*.rs",
    "src/**/*.m2",
    "src/**/*.toml",
    "Cargo.lock",
    "CHANGELOG.md",
    "LICENSE-APACHE",
    "LICENSE-MIT",
    "README.md",
]

[[bin]]
name = "sp2"
path = "src/main.rs"

[dependencies]
base64 = "0.22.1"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = { version = "0.29.0", features = ["osc52", "serde"] }
html2text = "0.17.1"
lsp-server = "0.10.0"
lsp-types = "0.97.0"
m2-syn = { version = "0.7.1", default-features = false }
nix = { version = "0.29.0", features = ["signal"] }
regex = "1.11"
ratatui = { version = "0.30.0", features = ["serde"] }
ratatui-image = { version = "11.1.0", default-features = false, features = ["crossterm"] }
rand = "0.8.6"
ratex-layout = "0.1.15"
ratex-parser = "0.1.15"
ratex-svg = { version = "0.1.15", features = ["embed-fonts"] }
ratex-types = "0.1.15"
resvg = { version = "0.48.1", default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
term-maths = "1.0.0"
thiserror = "2.0.18"
unicode-width = "0.2"
url = "2.5"
toml = "1.1.4"
these-macros-should-be-illegal = "0.7.0"
tree-sitter-highlight = "0.26.13"
tree-sitter-macaulay2 = "=6.2.0"

[lints.rust]
missing_docs = "deny"

[dev-dependencies]

[build-dependencies]
toml = "1.1.4"
