# Native palette source: https://github.com/catppuccin/nvim
# Palette names are shared by every variant; values retain their upstream RGB identity.
name = "catppuccin"

[variants]
dark = ["mocha", "macchiato", "frappe"]
light = ["latte"]

[palette."base"]
dark = { mocha = "#1e1e2e", macchiato = "#24273a", frappe = "#303446" }
light = "#eff1f5"

