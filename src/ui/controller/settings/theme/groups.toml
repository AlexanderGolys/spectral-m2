RejectedCellMarker = { link = "Error" }
PrintedCellNumber = { link = "Muted" }
PendingSeparator = { link = "Muted" }
MutedCodeText = { link = "Muted" }
ErrorBorder = { link = "Error" }
ErrorMessage = { link = "Error" }
ErrorCode = { link = "Code", tint_from = "Error.fg", tint = 0.12 }
WarningBorder = { link = "Warning" }
