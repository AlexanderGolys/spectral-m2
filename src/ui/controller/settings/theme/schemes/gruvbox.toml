Attribute = { fg = "purple" }
Builtin = { fg = "orange" }
Regex = { fg = "blue", sp = "blue", underline = true }
Accent = { fg = "aqua" }
Error = { fg = "red" }
Warning = { fg = "yellow" }
Info = { fg = "blue" }
Hint = { fg = "aqua" }

[overrides]
Constant = { fg = "orange" }
