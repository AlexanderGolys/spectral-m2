name = "gruvbox"

[variants]
dark = ["hard", "medium", "soft"]
light = ["hard", "medium", "soft"]

[colors.red]
dark = { base = "#fb4934", dark = "#9d0006" }
light = { base = "#9d0006", light = "#fb4934" }

[colors.green]
dark = { base = "#b8bb26", dark = "#79740e" }
light = { base = "#79740e", light = "#b8bb26" }

[colors.yellow]
dark = { base = "#fabd2f", dark = "#b57614" }
light = { base = "#b57614", light = "#fabd2f" }

[colors.blue]
dark = { base = "#83a598", dark = "#076678" }
light = { base = "#076678", light = "#83a598" }

[colors.purple]
dark = { base = "#d3869b", dark = "#8f3f71" }
light = { base = "#8f3f71", light = "#d3869b" }

[colors.aqua]
dark = { base = "#8ec07c", dark = "#427b58" }
light = { base = "#427b58", light = "#8ec07c" }

[colors.orange]
dark = { base = "#fe8019", dark = "#af3a03" }
light = { base = "#af3a03", light = "#fe8019" }

[colors.gray]
