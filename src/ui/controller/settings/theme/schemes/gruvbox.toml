[colors.bg]
dark = { hard = ["#1d2021", "#161819", "#3c3836", "#665c54", "#504945"], medium = ["#282828", "#1d2021", "#3c3836", "#665c54", "#504945"], soft = ["#32302f", "#282828", "#3c3836", "#665c54", "#504945"] }
light = { hard = ["#f9f5d7", "#d5c4a1", "#ebdbb2", "#bdae93", "#d5c4a1"], medium = ["#fbf1c7", "#d5c4a1", "#ebdbb2", "#bdae93", "#d5c4a1"], soft = ["#f2e5bc", "#d5c4a1", "#ebdbb2", "#bdae93", "#d5c4a1"] }

[base]
Canvas = { bg = "bg0" }
Code = { bg = "bg1" }
Raised = { bg = "bg2" }
