[base]
Canvas = { bg = "base" }
Code = { bg = "_nc" }
Raised = { bg = "surface" }
Pending = { bg = "surface" }
Selection = { bg = "highlight_med" }
Focus = { bg = "highlight_low" }

Text = { fg = "text" }
Muted = { fg = "subtle" }
Faint = { fg = "highlight_low" }

Keyword = { fg = "pine" }
Function = { fg = "rose" }
Type = { fg = "foam" }
String = { fg = "gold" }
Number = { fg = "gold" }
Operator = { fg = "subtle" }
Symbol = { fg = "iris", italic = true }
Parameter = { fg = "iris", italic = true }
Property = { fg = "foam", italic = true }
Builtin = { fg = "love", bold = true, italic = true }
Regex = { fg = "iris", sp = "iris", underline = true }
EnumVariant = { fg = "leaf" }
Attribute = { fg = "gold", italic = true }
Macro = { fg = "rose", italic = true }

Accent = { fg = "foam" }
Error = { fg = "love" }
Warning = { fg = "gold" }
Info = { fg = "foam" }
Hint = { fg = "pine" }

[overrides]
Boolean = { fg = "rose" }
Variable = { fg = "text", italic = true }
Installation = { fg = "foam" }
Quote = { fg = "gold" }
Documentation = { fg = "iris", sp = "iris", underline = true }
