# Native palette source: https://github.com/sainnhe/everforest
# Palette names are shared by every variant; values retain their upstream RGB identity.
name = "everforest"

[variants]
dark = ["hard", "medium", "soft"]
light = ["hard", "medium", "soft"]

[palette."aqua"]
dark = "#83c092"
light = "#35a77c"

[palette."bg0"]
dark = { hard = "#272e33", medium = "#2d353b", soft = "#333c43" }
light = { hard = "#fffbef", medium = "#fdf6e3", soft = "#f3ead3" }

[palette."bg1"]
